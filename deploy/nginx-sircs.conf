# Ejemplo de sitio Nginx para el frontend de SIRCS.
# Cambia sircs.tudominio.com por tu subdominio real.
# HTTPS: después de activarlo, corre `sudo certbot --nginx -d sircs.tudominio.com`.
# Usuario y contraseña: `sudo htpasswd -c /etc/nginx/.htpasswd-sircs equipo`

server {
    listen 80;
    server_name sircs.tudominio.com;

    root /var/www/sircs;
    index index.html;

    # Solo el equipo y el profesor pueden entrar
    auth_basic "SIRCS - simulación académica";
    auth_basic_user_file /etc/nginx/.htpasswd-sircs;

    # No indexar en buscadores
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Archivos con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # App de una sola página: toda ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
